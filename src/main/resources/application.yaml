spring:
  application:
    name: OrangeMarketBackend
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/orange_market?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

mybatis-plus:
    mapper-locations: classpath*:/mapper/**/*.xml
    type-aliases-package: com.czlr.orangemarketbackend.**.entity
    configuration:
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        id-type: assign_id          # 雪花 ID
        logic-delete-field: deletedAt
        logic-delete-value: NOW()
        logic-not-delete-value: 'NULL'
